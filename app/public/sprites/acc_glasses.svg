<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2816 1536" shape-rendering="crispEdges">
  <!-- Left lens frame (covers left eye x=1315-1384, y=398-470) -->
  <rect x="1304" y="392" width="88" height="84" fill="#667788"/>
  <!-- Left lens inner -->
  <rect x="1312" y="400" width="72" height="68" fill="#1A2030" opacity="0.5"/>
  <!-- Left lens reflection -->
  <rect x="1314" y="402" width="20" height="14" fill="#AABBCC" opacity="0.55"/>
  <!-- Right lens frame (covers right eye x=1432-1502, y=398-470) -->
  <rect x="1428" y="392" width="82" height="84" fill="#667788"/>
  <!-- Right lens inner -->
  <rect x="1436" y="400" width="66" height="68" fill="#1A2030" opacity="0.5"/>
  <!-- Right lens reflection -->
  <rect x="1438" y="402" width="20" height="14" fill="#AABBCC" opacity="0.55"/>
  <!-- Frame top highlight -->
  <rect x="1304" y="392" width="88" height="7" fill="#8899AA"/>
  <rect x="1428" y="392" width="82" height="7" fill="#8899AA"/>
  <!-- Bridge -->
  <rect x="1388" y="422" width="44" height="18" fill="#667788"/>
  <!-- Left arm (temple) -->
  <rect x="1240" y="420" width="68" height="12" fill="#667788"/>
  <!-- Right arm (temple) -->
  <rect x="1506" y="420" width="68" height="12" fill="#667788"/>
</svg>
