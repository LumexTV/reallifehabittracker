<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2816 1536" shape-rendering="crispEdges">
  <!-- Main top cap (across full head width) -->
  <rect x="1220" y="235" width="376" height="106" fill="#6B3E1C"/>
  <!-- Highlight on top -->
  <rect x="1330" y="235" width="120" height="36" fill="#8B5A2E"/>
  <rect x="1358" y="247" width="64" height="14" fill="#A07040"/>
  <!-- Shadow at bottom of cap -->
  <rect x="1220" y="313" width="376" height="22" fill="#4A2910"/>
  <!-- Left temple (down to above eye level) -->
  <rect x="1152" y="235" width="90" height="188" fill="#6B3E1C"/>
  <rect x="1152" y="399" width="90" height="16" fill="#4A2910"/>
  <!-- Right temple -->
  <rect x="1574" y="235" width="90" height="188" fill="#6B3E1C"/>
  <rect x="1574" y="399" width="90" height="16" fill="#4A2910"/>
  <!-- Forehead fringe (slight overhang) -->
  <rect x="1268" y="335" width="280" height="52" fill="#6B3E1C"/>
  <rect x="1268" y="363" width="280" height="18" fill="#4A2910"/>
</svg>
